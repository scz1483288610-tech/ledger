<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>账本</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F2F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F1F2F3;--card:#FFFFFF;--ink:#1D1E20;--ink2:#6A6F75;--ink3:#9AA0A6;--line:#E5E7E9;--soft:#F4F5F6;
  --y:#F2C94C;--y2:#FBEFC0;--b:#2F74B5;--b2:#DDEBF8;--b3:#8DB9E2;--r:#B8433A;--r2:#F5E0DD;
  --on:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121314;--card:#1C1D1F;--ink:#ECEEEF;--ink2:#A0A5AA;--ink3:#767B80;--line:#2B2D2F;--soft:#242628;
    --y:#E6BD43;--y2:#3A3319;--b:#7DB6EC;--b2:#1E2F40;--b3:#3F6A94;--r:#E58A82;--r2:#3A2220;--on:#161718;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 92px)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--ink2);margin-top:1px}
.top .sub b{color:var(--ink);font-weight:600}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.icon svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nudge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--y2);color:var(--ink);font-size:11.5px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:space-between}
.card h3 .r{font-weight:400;font-size:12px;color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.mark{background:linear-gradient(transparent 62%,var(--y) 62%,var(--y) 92%,transparent 92%);padding:0 2px}
.good{color:var(--b)}.bad{color:var(--r)}.dim{color:var(--ink2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--ink2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px}
.sec-h h2{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.empty{padding:22px 12px;text-align:center;color:var(--ink2);font-size:13.5px}

/* buttons */
.btn{height:46px;border-radius:14px;background:var(--ink);color:var(--on);font-weight:600;padding:0 18px;width:100%}
.btn:active{opacity:.85}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{height:36px;border-radius:11px;font-size:13.5px;width:auto;padding:0 14px}
.btn.danger{background:var(--r2);color:var(--r);border:0}
.link{color:var(--b);font-size:13px}

/* quick add */
.amtrow{display:flex;align-items:center;gap:10px}
.amtbox{flex:1;display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.amtbox:focus-within{border-color:var(--ink)}
.amtbox i{font-style:normal;font-size:20px;color:var(--ink2)}
.amtbox input{border:0;background:none;outline:none;width:100%;font-size:30px;font-weight:700;padding:2px 0;font-variant-numeric:tabular-nums}
.datebtn{position:relative;height:50px;padding:0 12px;display:grid;place-items:center;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--ink2);white-space:nowrap}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.chip.fast{background:var(--y2);border-color:transparent}
.chip.fast b{font-weight:600}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.frow{display:flex;gap:10px;margin-top:12px;align-items:center}
.frow .grow{flex:1}
.note{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px;outline:none}
.note:focus{border-color:var(--ink)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tog input{width:18px;height:18px;accent-color:var(--ink)}

/* week */
.weekhead{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:19px;font-weight:700;line-height:1.1}
.ring .c small{font-size:11px;color:var(--ink2)}
.stats{flex:1;min-width:0}
.stats .kv{padding:5px 0;font-size:13.5px}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;align-items:end}
.b7{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.b7 .col{width:100%;height:58px;border-radius:8px;background:var(--soft);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.b7 .col i{display:block;width:100%;border-radius:8px}
.b7 .col .ln{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);opacity:.7}
.b7 span{font-size:11.5px;color:var(--ink2)}
.b7 em{font-style:normal;font-size:10.5px;color:var(--ink3);height:13px}
.b7.today span{color:var(--ink);font-weight:700;background:linear-gradient(transparent 60%,var(--y) 60%);padding:0 3px}
.b7.fut .col{background:transparent;border:1px dashed var(--line)}

/* progress rows */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.prow .dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.prow .nm{font-size:14px}
.prow .track{grid-column:1/-1;height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:-2px}
.prow .track i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.prow .amt{font-size:14px;font-weight:600}
.prow .amt small{font-weight:400;color:var(--ink3);margin-left:4px}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.bar.over i{background:var(--r)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--y)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink2);margin-top:8px}

/* month grid */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.cal .wd{font-size:11px;color:var(--ink3);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--ink2);background:var(--soft);position:relative}
.cal .d.z{background:var(--b2);color:var(--b)}
.cal .d.u{background:var(--b3);color:#fff}
.cal .d.o{background:var(--y);color:#1D1E20}
.cal .d.x{background:var(--r);color:#fff}
.cal .d.f{background:transparent;border:1px dashed var(--line);color:var(--ink3)}
.cal .d.t{outline:2px solid var(--ink);outline-offset:1px}
.cal .d.e{visibility:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* entries */
.day{margin-bottom:10px}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:0 6px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-weight:600}
.row .rn{font-size:12.5px;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ra{font-weight:600}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--soft);color:var(--ink2);font-size:11px;font-weight:400;vertical-align:1px;border:1px solid var(--line)}
.tag.hl{background:var(--y2);border-color:transparent;color:var(--ink)}
.x{font-size:12.5px;color:var(--ink3);padding:6px 4px}

/* cash */
.bigcash{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .track{grid-column:1/-1;height:5px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:3px}
.acc .track i{display:block;height:100%;background:var(--ink);border-radius:99px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-size:9.5px;fill:var(--ink3)}
.cyc{margin:18px 4px 8px}
.cyc .t{display:flex;align-items:center;justify-content:space-between}
.cyc h2{margin:0;font-size:14px;font-weight:700}
.cyc .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.ev{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.ev:first-child{border-top:0}
.ev .evn{font-weight:500}
.ev .evs{font-size:12px;color:var(--ink2)}
.ev .eva{font-weight:600;text-align:right}
.ev .eva.in{color:var(--b)}
.ev input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.ev.done .evn,.ev.done .eva{text-decoration:line-through;color:var(--ink3)}
.ev.late .evs{color:var(--r)}
.sp{display:block;width:20px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,var(--bg) 30%);pointer-events:none}
.tabs .in{pointer-events:auto;width:100%;max-width:520px;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.tabs button{flex:1;height:46px;border-radius:15px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button[aria-current=page]{background:var(--ink);color:var(--on);font-weight:600}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow:auto;border:1px solid var(--line)}
#sheet h2{margin:0 0 4px;font-size:18px}
#sheet .sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px;outline:none}
.fld textarea{height:auto;min-height:92px;padding:10px 12px;font-size:13.5px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ink)}
.fld small{display:block;font-size:12px;color:var(--ink3);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}
.menu{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);margin-top:8px}
.menu b{display:block;font-weight:600}
.menu span{font-size:12.5px;color:var(--ink2)}
.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw .s{font-size:12px;color:var(--ink2)}
.sw.off .nm{color:var(--ink3);text-decoration:line-through}
#toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:30;max-width:492px;margin:0 auto;background:var(--ink);color:var(--on);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px}
#toast button{color:var(--y);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>账本</h1>
      <div class="sub" id="subline"></div>
    </div>
    <button class="icon" id="btnSet" type="button" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main>
  <!-- ========== 今天 ========== -->
  <section id="tab-today">
    <div id="onboard"></div>
    <div class="card" id="quick">
      <div class="amtrow">
        <label class="amtbox"><i>¥</i><input id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="金额"></label>
        <label class="datebtn"><span id="dateLbl">今天</span><input id="dt" type="date" aria-label="日期"></label>
      </div>
      <div class="chips" id="fastChips"></div>
      <div class="chips" id="catChips" style="padding-top:2px"></div>
      <div class="frow">
        <div class="seg grow" id="paySeg"><button type="button" data-p="card" aria-pressed="true">信用卡</button><button type="button" data-p="debit" aria-pressed="false">储蓄卡</button></div>
        <label class="tog"><input id="sp" type="checkbox">特殊,不占额度</label>
      </div>
      <div class="frow"><input class="note" id="nt" type="text" placeholder="备注(可不写)" maxlength="40" aria-label="备注"></div>
      <div class="frow"><button class="btn" id="btnAdd" type="button">记下来</button></div>
    </div>

    <div class="card" id="weekCard"></div>
    <div class="card" id="monthCard"></div>
    <div class="card" id="catCard"></div>
    <div class="card" id="dogCard"></div>
    <div id="entries"></div>
  </section>

  <!-- ========== 现金 ========== -->
  <section id="tab-cash" hidden>
    <div class="card" id="cashCard"></div>
    <div class="card" id="runCard"></div>
    <div id="cycles"></div>
  </section>

  <!-- ========== 存钱 ========== -->
  <section id="tab-save" hidden>
    <div id="saveBody"></div>
  </section>
  </main>
</div>

<nav class="tabs"><div class="in">
  <button type="button" data-tab="today" aria-current="page">今天</button>
  <button type="button" data-tab="cash">现金</button>
  <button type="button" data-tab="save">存钱</button>
</div></nav>

<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var VERSION='1.0.1';

/* ================= utils ================= */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
var daysBetween=function(a,b){return Math.round((parse(b)-parse(a))/864e5);};
var dow=function(s){return (parse(s).getDay()+6)%7;};
var mondayOf=function(s){return addDays(s,-dow(s));};
var todayStr=function(){return ymd(new Date());};
var WD=['一','二','三','四','五','六','日'];
var md=function(s){var p=s.split('-');return (+p[1])+'/'+(+p[2]);};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var sum=function(a,f){return a.reduce(function(t,x){return t+(f?f(x):x);},0);};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var r2=function(n){return Math.round(n*100)/100;};
function money(n){
  n=r2(n||0);var neg=n<0;n=Math.abs(n);
  var s=(n%1===0)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+'¥'+s;
}
function num(v){var n=parseFloat(String(v).replace(/[,，¥\s]/g,''));return isFinite(n)?n:NaN;}
function monthsBetween(a,b){
  var out=[],p=a.split('-').map(Number),q=b.split('-').map(Number),y=p[0],m=p[1];
  while(y<q[0]||(y===q[0]&&m<=q[1])){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}
  return out;
}
function daysInMonthKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function clampDay(m,day){return pad(Math.min(day,daysInMonthKey(m)));}

/* ================= state ================= */
var LS='ledger.v1',LSTAB='ledger.tab',LSMEM='ledger.fp';
var CATS=['三餐','咖啡','交通','日用','订阅','狗','其他'];
var CATCLR={};
function starter(){
  return {
    v:1,
    settings:{
      weekQuota:1000,monthTarget:4000,planMonthly:4000,instMonthly:0,bufferTarget:3000,
      trackStart:todayStr(),cardFrom:todayStr(),stmtDay:23,dueDay:11,payDay:20,
      horizon:ymd(new Date(new Date().getFullYear()+1,new Date().getMonth(),28)),
      babyOpen:0,planStart:todayStr(),
      chips:[{c:'咖啡',a:12.9,n:'咖啡'},{c:'交通',a:60,n:'地铁'},{c:'狗',a:120,n:'狗粮',dog:true}],
      dog:{price:120,every:45,last:null}

}
var S=starter();
function norm(o){
  var s=starter();
  if(!o||typeof o!=='object')return s;
  s.settings=Object.assign(s.settings,o.settings||{});
  if(!s.settings.dog||typeof s.settings.dog!=='object')s.settings.dog={price:120,every:45,last:null};
  if(!Array.isArray(s.settings.chips))s.settings.chips=starter().settings.chips;

/* ================= settings helpers ================= */
var st=function(){return S.settings;};
function cardOf(e){return e.m==='card';}

/* ================= card cycle ================= */
function cycleOfDate(t){
  var p=t.split('-').map(Number),sd=st().stmtDay;
  var stmt=p[2]<=sd?ymd(new Date(p[0],p[1]-1,sd)):ymd(new Date(p[0],p[1],sd));
  var q=stmt.split('-').map(Number);
  var prev=ymd(new Date(q[0],q[1]-2,sd));
  return {start:addDays(prev,1),stmt:stmt};
}
function dueCycle(due){
  var p=due.split('-').map(Number),sd=st().stmtDay;
  var stmt=ymd(new Date(p[0],p[1]-2,sd)),prev=ymd(new Date(p[0],p[1]-3,sd));
  return {start:addDays(prev,1),stmt:stmt};
}
function entriesIn(a,b,f){return S.entries.filter(function(x){return x.d>=a&&x.d<=b&&(!f||f(x));});}
function cardAmount(due){
  var c=dueCycle(due),t=todayStr();
  var cardAll=entriesIn(c.start,c.stmt,cardOf);
  var norm_=sum(cardAll.filter(function(x){return !x.sp;}),function(x){return x.a;});
  var spc=sum(cardAll.filter(function(x){return x.sp;}),function(x){return x.a;});
  var closed=t>c.stmt,inst=st().instMonthly||0;
  var base=closed?norm_:Math.max(norm_,st().planMonthly||st().monthTarget);
  return {amount:r2(base+spc+inst),est:!closed,cyc:c};
}

/* ================= events ================= */
var KORD={in:0,out:1,card:1,'save-baby':1,'wife-save':2,'baby-out':2};
var isIn=function(k){return k==='in';};
var isCash=function(k){return k==='out'||k==='card'||k==='save-baby';};
function buildEvents(from,to){
  var ev=[];
  S.defs.forEach(function(d){
    if(d.on===false)return;
    var w=d.when||{};
    function push(date,amount,extra){
      if(date<from||date>to)return;
      if(!(amount>0)&&d.kind!=='card')return;
      ev.push(Object.assign({id:d.id+'_'+date,defId:d.id,date:date,name:d.name,kind:d.kind,amount:amount,note:d.note||'',exp:!!d.exp},extra||{}));
    }
    if(w.t==='monthly'){
      monthsBetween((w.from||from).slice(0,7),to.slice(0,7)).forEach(function(m){
        if(w.from&&m<w.from)return;
        if(w.to&&m>w.to)return;
        var date=m+'-'+clampDay(m,w.day);
        if(d.kind==='card'){
          if(d.by&&d.by[m]!=null)push(date,d.by[m],{est:false,fix:true});
          else{var c=cardAmount(date);push(date,c.amount,{est:c.est});}
        }else push(date,(d.by&&d.by[m]!=null)?d.by[m]:d.amount);
      });
    }else if(w.t==='dates'){
      (w.list||[]).forEach(function(p){push(p[0],p[1]);});
    }else if(w.t==='undated'&&w.date){
      push(w.date,d.amount);
    }
  });
  ev.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(KORD[a.kind]||0)-(KORD[b.kind]||0);});
  return ev;
}

/* ================= cash projection ================= */
function baseCash(){return r2(sum(S.accounts,function(a){return a.bal||0;}));}
var _proj=null;
function projection(){
  if(_proj)return _proj;
  var asOf=S.cashAsOf,end=st().horizon,t=todayStr();
  var delta={};
  function add(d,v){delta[d]=(delta[d]||0)+v;}
  buildEvents(addDays(asOf,1),end).forEach(function(e){
    if(isIn(e.kind))add(e.date,e.amount);
    else if(isCash(e.kind))add(e.date,-e.amount);
  });
  S.entries.forEach(function(x){if(x.m!=='card'&&x.d>asOf&&x.d<=end)add(x.d,-x.a);});
  var series=[],c=baseCash(),d=asOf,min=null,today=null;
  series.push({d:d,c:c});
  while(d<end){
    d=addDays(d,1);c=r2(c+(delta[d]||0));
    series.push({d:d,c:c});
  }
  series.forEach(function(p){
    if(p.d===t)today=p;
    if(p.d>=t&&(!min||p.c<min.c))min=p;
  });
  var at={};series.forEach(function(p){at[p.d]=p.c;});
  _proj={series:series,min:min,today:today?today.c:baseCash(),at:at};
  return _proj;
}
function cashAt(d){var P=projection();if(P.at[d]!=null)return P.at[d];var s=P.series;return d<s[0].d?s[0].c:s[s.length-1].c;}
function invalidate(){_proj=null;}

/* ================= week / month ================= */
function dayTotal(d){return sum(S.entries.filter(function(x){return x.d===d&&!x.sp;}),function(x){return x.a;});}
function weekInfo(){
  var t=todayStr(),ws=mondayOf(t),we=addDays(ws,6),from=ws<st().trackStart?st().trackStart:ws;
  var total=Math.max(1,daysBetween(from,we)+1),partial=total<7;
  var q=partial?Math.round(st().weekQuota*total/7):st().weekQuota;
  var spent=sum(entriesIn(from,we,function(x){return !x.sp;}),function(x){return x.a;});
  return {t:t,ws:ws,we:we,from:from,total:total,partial:partial,q:q,spent:spent,remain:q-spent,
    left:Math.max(1,daysBetween(t,we)+1),elapsed:Math.max(1,daysBetween(from,t)+1)};
}

  var mi=pts.findIndex(function(p){return p===P.min||(p.d===P.min.d);});

function evRow(e,t,ctx){

function renderCash(){
  var P=projection(),t=todayStr(),asOf=S.cashAsOf,bc=baseCash();
  var html='<h3>手里现金<span class="r">按 '+md(asOf)+' 余额推算</span></h3>'+
    '<div class="bigcash num"><span class="mark">'+money(P.today)+'</span></div>';
  if(S.accounts.length){
    var tot=Math.max(1,sum(S.accounts,function(a){return Math.max(0,a.bal||0);}));
    html+='<div style="margin-top:12px">'+S.accounts.map(function(a){return '<div class="acc"><span>'+esc(a.name)+'</span><span class="num" style="font-weight:600">'+money(a.bal)+'</span><div class="track"><i style="width:'+Math.max(0,(a.bal||0)/tot*100).toFixed(0)+'%"></i></div></div>';}).join('')+'</div>';
  }else html+='<p class="hint">还没填账户余额。点下面“校准现金”,把各张卡的余额填进去。</p>';
  html+='<div class="btns"><button class="btn sec sm" type="button" data-act="calib">校准现金</button><button class="btn sec sm" type="button" data-act="addplan">加一笔计划</button></div>';
  html+='<p class="hint">这是按 '+md(asOf)+' 的实际余额,加上之后的收入和要付的钱推算出来的。隔一阵子拿实际余额校准一次,最准。</p>';
  $('#cashCard').innerHTML=html;

  // run card
  var all=buildEvents(addDays(t,-1),st().horizon);
  var pays=all.filter(function(e){return e.defId==='pay'&&e.date>=t;}),np=pays[0];
  var rh='<h3>未来现金预测<span class="r">到 '+md(st().horizon)+'</span></h3>';
  if(!S.accounts.length&&!S.defs.length)rh+='<div class="empty" style="padding:8px 0">先校准现金、加几笔计划,这里就会出现预测。</div>';
  else{
    rh+=chartSVG();
    var mn=P.min,low=mn&&mn.c<st().bufferTarget;
    rh+='<div class="kv" style="margin-top:8px"><span>最低点</span><span class="num '+(low?'bad':'good')+'">'+(mn?money(mn.c)+' · '+md(mn.d):'—')+'</span></div>';
    if(np){
      var before=cashAt(addDays(np.date,-1)),need=sum(all.filter(function(e){return isCash(e.kind)&&!S.done[e.id]&&e.date>=t&&e.date<np.date;}),function(e){return e.amount;});
      rh+='<div class="kv"><span>下次发薪 '+md(np.date)+'(还有 '+Math.max(0,daysBetween(t,np.date))+' 天)前</span><span class="num">'+money(before)+'</span></div>';
      rh+='<div class="kv"><span>这期间还要付</span><span class="num">'+money(need)+'</span></div>';
    }
    rh+=low?'<p class="hint bad">预测会低于安全线 '+money(st().bufferTarget)+',看一下哪笔能推后或少存。</p>':'<p class="hint">黄色虚线是安全线。预测最低点在它上面就稳。</p>';
  }
  $('#runCard').innerHTML=rh;

  // cycles
  var cs=cycleStartOf(t),end=st().horizon,starts=[cs],cur=cs;
  while(true){var p=cur.split('-').map(Number);var nx=ymd(new Date(p[0],p[1],st().payDay));if(nx>end)break;starts.push(nx);cur=nx;}
  var evs=buildEvents(addDays(t,-5)<cs?cs:addDays(t,-5),end),h='';
  // full events for cycle sums
  var full=buildEvents(cs,end);
  starts.slice(0,7).forEach(function(s0,i){
    var nx=starts[i+1],e0=nx?addDays(nx,-1):end;
    var inC=full.filter(function(e){return e.date>=s0&&e.date<=e0;});
    var current=s0<=t&&t<=e0,base=current?inC.filter(function(e){return e.date>=t;}):inC;
    var inn=sum(base.filter(function(e){return isIn(e.kind);}),function(e){return e.amount;}),out=sum(base.filter(function(e){return isCash(e.kind);}),function(e){return e.amount;}),net=inn-out;
    var shown=inC.filter(function(e){return e.date>=addDays(t,-5);});
    h+='<div class="cyc"><div class="t"><h2>'+md(s0)+' – '+md(e0)+'</h2>'+(current?'<span class="tag hl">进行中</span>':'')+'</div>'+
      '<div class="s">'+(current?'今天起还要进 ':'进 ')+money(inn)+' · '+(current?'还要付 ':'出 ')+money(out)+' · '+(current?'净 ':'结余 ')+'<b class="'+(net<0?'bad':'good')+'">'+money(net)+'</b></div>'+
      '<div class="s">周期末现金约 <b class="num '+(cashAt(e0)<0?'bad':'')+'">'+money(cashAt(e0))+'</b></div></div>';
    h+=shown.length?'<div class="list">'+shown.map(function(e){return evRow(e,t);}).join('')+'</div>':'<div class="empty">这段没有要付的。</div>';
  });
  $('#cycles').innerHTML=h;
}

      '<div class="kv"><span>付完尾款后基金预计(不含太太)</span><span class="num '+(after<0?'bad':'')+'">'+money(after)+'</span></div>';
  }
  html+='<div class="btns"><button class="btn sec sm" type="button" data-act="dep" data-m="in">存入</button><button class="btn sec sm" type="button" data-act="dep" data-m="out">取出(买宝宝用品等)</button></div></div>';
  // plan list

  html+='<div class="sec-h"><h2>存入计划</h2><span class="hint" style="margin:0">打钩 = 已存,会记进余额</span></div>';
  html+=pl.length?'<div class="list">'+pl.map(function(e){return evRow(e,t,'save');}).join('')+'</div>':'<div class="empty">还没有存入计划。</div>';

  var recs=S.saves.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0}).slice(0,12);

  $('#saveBody').innerHTML=html;

  openSheet('<h2>设置</h2><div class="sub">版本 '+VERSION+' · 数据只存在这台手机里</div>'+
    '<div class="two"><label class="fld"><span>每周额度</span><input id="s-w" type="text" inputmode="decimal" value="'+s.weekQuota+'"></label><label class="fld"><span>每账期目标</span><input id="s-m" type="text" inputmode="decimal" value="'+s.monthTarget+'"></label></div>'+
    '<div class="two"><label class="fld"><span>预测按每月日常</span><input id="s-p" type="text" inputmode="decimal" value="'+(s.planMonthly||s.monthTarget)+'"><small>算现金预测用,比目标保守一点</small></label><label class="fld"><span>信用卡分期月供</span><input id="s-i" type="text" inputmode="decimal" value="'+(s.instMonthly||0)+'"></label></div>'+
    '<div class="two"><label class="fld"><span>安全线(缓冲)</span><input id="s-b" type="text" inputmode="decimal" value="'+s.bufferTarget+'"></label><label class="fld"><span>预测到哪天</span><input id="s-h" type="date" value="'+s.horizon+'"></label></div>'+
    '<div class="two"><label class="fld"><span>从哪天开始记额度</span><input id="s-t" type="date" value="'+s.trackStart+'"></label><label class="fld"><span>信用卡从哪天开始用</span><input id="s-c" type="date" value="'+s.cardFrom+'"></label></div>'+
    '<div class="two"><label class="fld"><span>宝宝基金期初余额</span><input id="s-o" type="text" inputmode="decimal" value="'+(s.babyOpen||0)+'"></label><label class="fld"><span>狗粮价格</span><input id="s-dp" type="text" inputmode="decimal" value="'+s.dog.price+'"></label></div>'+
    '<div class="btns"><button class="btn" type="button" data-act="setsave">保存</button></div>'+
    '<button class="menu" type="button" data-act="plans"><b>计划项目</b><span>工资、房贷、还款、存入计划,可以开关和改金额</span></button>'+
    '<button class="menu" type="button" data-act="backup"><b>备份与恢复</b><span>导出备份文件,或者从备份文件恢复</span></button>');
}
function setSave(){
  var s=st(),v=function(id){return num($(id).value);};
  var w=v('#s-w'),m=v('#s-m'),pm=v('#s-p'),i=v('#s-i'),b=v('#s-b'),o=v('#s-o'),dp=v('#s-dp');
  if(isFinite(w)&&w>0)s.weekQuota=w;if(isFinite(m)&&m>0)s.monthTarget=m;if(isFinite(pm)&&pm>0)s.planMonthly=pm;if($('#s-h').value)s.horizon=$('#s-h').value;if(isFinite(i)&&i>=0)s.instMonthly=i;if(isFinite(b)&&b>=0)s.bufferTarget=b;if(isFinite(o))s.babyOpen=o;if(isFinite(dp)&&dp>0){s.dog.price=dp;s.chips.forEach(function(c){if(c.dog)c.a=dp;});}
  if($('#s-t').value)s.trackStart=$('#s-t').value;if($('#s-c').value)s.cardFrom=$('#s-c').value;
  save();closeSheet();buildChips();renderAll();toast('已保存');
}
function summarize(d){
  var w=d.when||{};
  if(w.t==='monthly')return '每月 '+w.day+' 号 · '+money(d.amount)+(w.from?' · 从 '+w.from:'');
  if(w.t==='dates')return (w.list||[]).map(function(p){return md(p[0])+' '+money(p[1]);}).join('、');
  return '未定日期 · '+money(d.amount);
}
function openPlans(){
  var html='<h2>计划项目</h2><div class="sub">点一项改金额,左边开关决定要不要计入预测。</div>';
  html+=S.defs.map(function(d){
    return '<div class="sw'+(d.on===false?' off':'')+'"><div><div class="nm" style="font-weight:500">'+esc(d.name)+'</div><div class="s">'+esc(summarize(d))+'</div></div><div style="display:flex;gap:8px"><button class="btn sec sm" type="button" data-act="defedit" data-id="'+esc(d.id)+'">改</button><button class="btn sec sm" type="button" data-act="deftoggle" data-id="'+esc(d.id)+'">'+(d.on===false?'打开':'关闭')+'</button></div></div>';
  }).join('')||'<div class="empty">还没有计划项目。</div>';
  html+='<div class="btns"><button class="btn sec" type="button" data-act="addplan">加一笔计划</button><button class="btn sec" type="button" data-act="settings">返回</button></div>';
  openSheet(html);
}
function openDefEdit(id){
  var d=defById(id),w=d.when;
  var html='<h2>'+esc(d.name)+'</h2>';
  if(w.t==='monthly'){
    var by=d.by?Object.keys(d.by).sort().map(function(k){return k+' '+d.by[k];}).join('\n'):'';
    html+='<div class="two"><label class="fld"><span>每月几号</span><input id="de-day" type="text" inputmode="numeric" value="'+w.day+'"></label><label class="fld"><span>默认金额</span><input id="de-a" type="text" inputmode="decimal" value="'+(d.amount||0)+'"></label></div>'+
      '<label class="fld"><span>某几个月金额不同(每行:月份 金额)</span><textarea id="de-by" placeholder="2026-12 311.92">'+esc(by)+'</textarea><small>信用卡账单项:这里填的月份就用你填的数(账单出来后的实际金额)。</small></label>';
  }else if(w.t==='dates'){
    var lines=(w.list||[]).map(function(p){return p[0]+' '+p[1];}).join('\n');
    html+='<label class="fld"><span>每行:日期 金额</span><textarea id="de-list">'+esc(lines)+'</textarea></label>';
  }else{
    html+='<div class="two"><label class="fld"><span>金额</span><input id="de-a" type="text" inputmode="decimal" value="'+(d.amount||0)+'"></label><label class="fld"><span>日期</span><input id="de-date" type="date" value="'+(w.date||'')+'"></label></div>';
  }
  html+='<label class="fld"><span>备注</span><input id="de-n" type="text" value="'+esc(d.note||'')+'"></label>'+
    '<div class="btns"><button class="btn" type="button" data-act="defsave" data-id="'+esc(id)+'">保存</button><button class="btn danger" type="button" data-act="defdel" data-id="'+esc(id)+'">删除</button></div>'+
    '<div class="btns"><button class="btn sec" type="button" data-act="plans">返回</button></div>';
  openSheet(html);
}
function defSave(id){
  var d=defById(id),w=d.when;
  if(w.t==='monthly'){
    var day=parseInt($('#de-day').value,10),a=num($('#de-a').value);
    if(day>=1&&day<=31)w.day=day;if(isFinite(a)&&a>=0)d.amount=a;
    var by={};($('#de-by').value||'').split('\n').forEach(function(l){var p=l.trim().split(/\s+/);if(/^\d{4}-\d{2}$/.test(p[0])&&isFinite(num(p[1])))by[p[0]]=num(p[1]);});
    d.by=by;
  }else if(w.t==='dates'){
    var list=[];($('#de-list').value||'').split('\n').forEach(function(l){var p=l.trim().split(/\s+/);if(/^\d{4}-\d{2}-\d{2}$/.test(p[0])&&num(p[1])>0)list.push([p[0],num(p[1])]);});
    w.list=list;
  }else{
    var a2=num($('#de-a').value);if(isFinite(a2)&&a2>=0)d.amount=a2;w.date=$('#de-date').value||null;
  }
  d.note=$('#de-n').value.trim();
  save();renderAll();openPlans();toast('已保存');
}

/* ================= backup ================= */
function backupJSON(){S.backupAt=todayStr();save();return JSON.stringify(S);}
function openBackup(){
  openSheet('<h2>备份与恢复</h2><div class="sub">数据只在这台手机里。建议每周导出一次,换手机或清理浏览器数据前一定要导出。</div>'+
    '<button class="menu" type="button" data-act="export"><b>导出备份文件</b><span>保存成 .json 文件</span></button>'+
    '<button class="menu" type="button" data-act="copyb"><b>复制备份文本</b><span>复制到剪贴板,可以发给自己</span></button>'+
    '<button class="menu" type="button" data-act="import"><b>从备份文件恢复</b><span>选择 .json 文件,会替换现在的数据</span></button>'+
    '<button class="menu" type="button" data-act="paste"><b>粘贴备份文本恢复</b><span>把复制的备份文本粘贴进来</span></button>'+
    '<div class="btns"><button class="btn sec" type="button" data-act="close">关闭</button></div>');
}
function doExport(){
  var data=backupJSON(),name='账本备份-'+todayStr()+'.json';
  try{
    var blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('已导出 '+name);renderAll();
  }catch(e){toast('导出失败,试试“复制备份文本”');}
}
function doCopy(){
  var data=backupJSON();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(function(){toast('已复制备份文本');renderAll();},function(){toast('复制失败');});}
  else{var t=document.createElement('textarea');t.value=data;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('已复制备份文本');}catch(e){toast('复制失败');}t.remove();renderAll();}
}
function restore(text){
  var o;try{o=JSON.parse(text);}catch(e){toast('这不是有效的备份');return;}
  if(!o||typeof o!=='object'||(!o.settings&&!o.entries&&!o.defs)){toast('这不是账本的备份');return;}
  S=norm(o);save();closeSheet();buildChips();resetForm();renderAll();toast('已恢复:'+S.entries.length+' 条记录,'+S.defs.length+' 个计划项目');
}
function pickFile(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json,text/plain';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restore(String(r.result||''));};r.readAsText(f);};
  inp.click();
}
function openPaste(){
  openSheet('<h2>粘贴备份文本</h2><label class="fld"><span>把备份文本粘贴到这里</span><textarea id="pb" style="min-height:160px"></textarea></label><div class="btns"><button class="btn" type="button" data-act="pastego">恢复</button><button class="btn sec" type="button" data-act="backup">返回</button></div>');
}

/* ================= events wiring ================= */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act],[data-tab],[data-cat],[data-fast],#paySeg button');
  if(ev.target.id==='scrim'){closeSheet();return;}
  if(!el)return;
  if(el.dataset.tab){showTab(el.dataset.tab);return;}
  if(el.dataset.cat){F.cat=el.dataset.cat;syncForm();return;}
  if(el.dataset.fast!=null){
    var c=st().chips[+el.dataset.fast];if(!c)return;
    $('#amt').value=c.a;F.cat=c.c;if(c.n&&!$('#nt').value)$('#nt').value=c.n;syncForm();$('#amt').blur();return;
  }
  if(el.closest('#paySeg')){F.pay=el.dataset.p;syncForm();return;}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='done'){return;} // handled by change
  if(a==='evedit'){if(ev.target.matches('input[type=checkbox]'))return;openEvEdit(id);return;}
  switch(a){
    case 'del':delEntry(id);break;
    case 'dogbuy':dogBuy();break;
    case 'close':closeSheet();break;
    case 'settings':openSettings();break;
    case 'setsave':setSave();break;
    case 'plans':openPlans();break;
    case 'deftoggle':{var d=defById(id);d.on=d.on===false;save();renderAll();openPlans();break;}
    case 'defedit':openDefEdit(id);break;
    case 'defsave':defSave(id);break;
    case 'defdel':{var dd=defById(id),snap=clone(dd),idx=S.defs.indexOf(dd);S.defs.splice(idx,1);save();renderAll();openPlans();toast('已删除“'+dd.name+'”',function(){S.defs.splice(idx,0,snap);save();renderAll();});break;}
    case 'addplan':openAddPlan();break;
    case 'npsave':npSave();break;
    case 'evsave':evSave(id,el.dataset.mode);break;
    case 'evoff':evOff(id);break;
    case 'calib':openCalib();break;
    case 'accadd':{var box=$('#accs'),wrap=document.createElement('div');wrap.innerHTML=accRow({name:'',bal:''},0);box.appendChild(wrap.firstChild);break;}
    case 'calsave':calSave();break;
    case 'dep':openDep(el.dataset.m);break;
    case 'depsave':depSave(el.dataset.m);break;
    case 'delsave':{var i=S.saves.findIndex(function(x){return x.id===id;});if(i>=0){var sv=S.saves.splice(i,1)[0];if(sv.id.indexOf('p:')===0)delete S.done[sv.id.slice(2)];save();renderAll();toast('已删除',function(){S.saves.push(sv);if(sv.id.indexOf('p:')===0)S.done[sv.id.slice(2)]=1;save();renderAll();});}break;}
    case 'backup':openBackup();break;
    case 'export':doExport();break;
    case 'copyb':doCopy();break;
    case 'import':pickFile();break;
    case 'paste':openPaste();break;
    case 'pastego':restore($('#pb').value);break;
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.matches('input[type=checkbox][data-act=done]')){toggleDone(el.dataset.id,el.checked);return;}
  if(el.id==='dt'){syncForm();return;}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&(ev.target.id==='amt'||ev.target.id==='nt')){ev.preventDefault();addEntry();}
  if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();
});
$('#btnAdd').addEventListener('click',addEntry);
$('#btnSet').addEventListener('click',openSettings);
$('#amt').addEventListener('input',function(){var v=this.value.replace(/[^0-9.]/g,'');var p=v.split('.');if(p.length>2)v=p[0]+'.'+p.slice(1).join('');this.value=v;});

/* ================= init ================= */
load();
resetForm();
var tab='today';try{tab=localStorage.getItem(LSTAB)||'today';}catch(e){}
renderAll();showTab(['today','cash','save'].indexOf(tab)>=0?tab:'today');
document.addEventListener('visibilitychange',function(){if(!document.hidden){if($('#sheet').hidden){var t=todayStr();if(!$('#dt').value||$('#dt').value<t){$('#dt').value=t;}syncForm();renderAll();}}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
window.__ledger={get S(){return S;},renderAll:renderAll,projection:projection,weekInfo:weekInfo,buildEvents:buildEvents,restore:restore};
})();
</script>
</body>
</html>
